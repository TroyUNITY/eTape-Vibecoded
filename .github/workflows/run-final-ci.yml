name: One-time CI Dispatch After Ladder Golden Refresh

on:
  push:
    branches:
      - trade-guard-performance
    paths:
      - .github/workflows/run-final-ci.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: trade-guard-performance

      - name: Remove temporary workflow and push clean branch
        shell: bash
        run: |
          git rm .github/workflows/run-final-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove one-time CI dispatch helper"
          git push origin HEAD:refs/heads/trade-guard-performance

      - name: Dispatch full CI against updated branch
        shell: bash
        env:
          GITHUB_TOKEN: \${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer \${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TroyUNITY/eTape-Vibecoded/actions/workflows/ci.yml/dispatches \
            --data '{"ref":"trade-guard-performance"}'
