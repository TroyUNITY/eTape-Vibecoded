name: CI

# Runs on every push to main and every pull request. Unlike release.yml
# (tag-triggered artifact build), this is the PR/push gate: engine tests,
# vet, lint, and the tygo TS-contract-drift check, plus the UI lint/test/
# build suite — all of which were previously hand-run only.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: go test (full)
        run: make -C engine test

      - name: go test -race (short)
        run: make -C engine test-race

      - name: go vet
        run: make -C engine vet

      # engine/.golangci.yml is v2 schema (version: "2") -- a v1 lint binary
      # rejects it, so this must install golangci-lint 2.x. golangci-lint-action
      # v7+ is dedicated to golangci-lint v2 (v6 and earlier only support v1).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: engine

      # Regenerates ui/src/gen/wsmsg.ts via `go tool tygo generate` and fails
      # if it drifts from the committed copy -- needs the ui/ tree, which the
      # checkout above already provides.
      - name: TS contract drift check (gen-ts-check)
        run: make -C engine gen-ts-check

  engine-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: go test (full)
        working-directory: engine
        # Capacity tests must not compete with other package load generators.
        run: go test -p 1 ./...

  ui:
    permissions:
      contents: write
    # Golden PNGs are generated on Windows. Cairo/Pango text rasterization is
    # OS-specific even with the same bundled TTF, so strict pixel comparison
    # must run on the baseline platform.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Refresh golden screenshots for intentional text update
        if: github.head_ref == 'stage2-4-bounded-live-monitoring' || github.head_ref == 'stage3-candidate-retention'
        working-directory: ui
        shell: pwsh
        run: |
          $env:UPDATE_GOLDENS = "1"
          npm run test:golden

      - name: Upload refreshed golden screenshots for review
        if: github.head_ref == 'stage2-4-bounded-live-monitoring' || github.head_ref == 'stage3-candidate-retention'
        uses: actions/upload-artifact@v4
        with:
          name: updated-ui-goldens
          path: ui/test/golden/goldens/*.png
          if-no-files-found: error

      - name: Test
        working-directory: ui
        run: npm test

      - name: Commit refreshed tape goldens to the PR branch
        if: github.head_ref == 'stage2-4-bounded-live-monitoring' || github.head_ref == 'stage3-candidate-retention'
        working-directory: ui
        shell: pwsh
        run: |
          git fetch origin $env:GITHUB_HEAD_REF
          git checkout -B $env:GITHUB_HEAD_REF FETCH_HEAD
          $env:UPDATE_GOLDENS = "1"
          npm run test:golden
          git add test/golden/goldens/tapecolor-*.png
          if (git diff --cached --quiet) {
            Write-Host "Tape golden references are already current."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(ui): refresh tape goldens for brighter text"
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
          }

      # Build already runs typecheck (npm run typecheck && vite build).
      - name: Build
        working-directory: ui
        run: npm run build
